# main にプッシュするたびに、
#   1. コンテナイメージを作って GitHub のレジストリ(ghcr.io)に置く
#   2. Azure のアプリ melancholy-dolphin を、そのイメージに入れ替える(作成済みのときだけ)
# Azure へのログインは OIDC(パスワードや鍵は保存しない)。setup.sh で1回だけ設定する。
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # setup.sh が表示した値。パスワードではない(このリポジトリの main からしか使えない)
  AZURE_CLIENT_ID: ""
  AZURE_TENANT_ID: "73331780-2261-4d6e-8035-b6ab264b65ae"
  AZURE_SUBSCRIPTION_ID: "3e675fc4-04d3-48c2-ab3a-d196daf8f4b3"

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 型チェックと偽の Azure を相手にしたテスト
        run: |
          npm ci
          npm run build
          pip install --quiet "mcp>=1.12,<2"
          ./test/run.sh | tee test.log
          grep -q "LEAKS: なし" test.log

      - name: イメージ名を小文字にする
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC の一時的な身分証明を発行してもらうため
    steps:
      - name: 設定の確認
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::notice::Azure の設定(AZURE_CLIENT_ID)がまだないので、入れ替えは飛ばします"
          fi

      - uses: azure/login@v2
        if: env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure のアプリを新しいイメージに入れ替える
        if: env.AZURE_CLIENT_ID != ''
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          az extension add -n containerapp --upgrade -y >/dev/null 2>&1
          az containerapp update -n melancholy-dolphin -g melancholy-dolphin-rg \
            --image "${{ needs.build.outputs.image }}:${{ github.sha }}" -o none
          az containerapp revision list -n melancholy-dolphin -g melancholy-dolphin-rg \
            --query "[?properties.active].{name:name, image:properties.template.containers[0].image, state:properties.runningState}" -o table
